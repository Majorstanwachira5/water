<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 120" width="100%" height="100%">
  <!-- Left Orange Faucet Tap Monogram Icon (M F E) for dark navy footer -->
  <g transform="translate(6, 4)">
    <rect x="28" y="8" width="48" height="8" rx="4" fill="#FFA040"/>
    <circle cx="28" cy="12" r="6" fill="#FF850D"/>
    <circle cx="76" cy="12" r="6" fill="#FF850D"/>
    <circle cx="52" cy="11" r="7" fill="#FFA040"/>
    <rect x="47" y="16" width="10" height="14" rx="2" fill="#D96B00"/>
    <rect x="40" y="28" width="24" height="8" rx="3" fill="#FFA040"/>
    <rect x="37" y="35" width="30" height="6" rx="2" fill="#D96B00"/>
    <path d="M 38 41 L 68 41 L 68 50 L 92 50 L 92 74 L 66 74 C 58 74, 46 74, 38 69 C 28 69, 24 75, 24 85 L 7 85 C 7 63, 18 50, 38 48 Z" fill="#FF850D"/>
    <rect x="88" y="44" width="12" height="36" rx="3" fill="#D96B00"/>
    <rect x="4" y="82" width="23" height="8" rx="3" fill="#D96B00"/>
    <text x="6" y="42" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="23" fill="#FFA040">M</text>
    <text x="73" y="42" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="23" fill="#FFA040">F</text>
    <text x="41" y="106" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="25" fill="#FFA040">E</text>
  </g>

  <!-- Vertical Divider Bar + D accent -->
  <line x1="118" y1="10" x2="118" y2="62" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <text x="111" y="84" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="18" fill="#FF850D">D</text>

  <!-- Bold Wordmark MICHAFORGE in White for dark background contrast -->
  <text x="132" y="54" font-family="'Inter', 'Arial Black', system-ui, sans-serif" font-weight="900" font-size="50" letter-spacing="1.5" fill="#FFFFFF">MICHAFORGE</text>

  <!-- — ENTERPRISES — in Brand Orange centered below MICHAFORGE -->
  <line x1="142" y1="73" x2="192" y2="73" stroke="#FF850D" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <text x="334" y="80" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="20" letter-spacing="4.5" fill="#FF850D">ENTERPRISES</text>
  <line x1="476" y1="73" x2="526" y2="73" stroke="#FF850D" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- White Pill Badge with Navy Text: • DEALERS IN ALL PLUMBING MATERIALS • -->
  <rect x="112" y="88" width="426" height="25" rx="12.5" fill="#FFFFFF"/>
  <circle cx="126" cy="100.5" r="3.5" fill="#FF850D"/>
  <text x="325" y="105" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="12.5" letter-spacing="1.4" fill="#073253">DEALERS IN ALL PLUMBING MATERIALS</text>
  <circle cx="524" cy="100.5" r="3.5" fill="#FF850D"/>
