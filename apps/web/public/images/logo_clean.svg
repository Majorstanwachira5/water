<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="100%" height="100%">
  <!-- High-Visibility Left Orange Faucet Tap Monogram Emblem (M F E) -->
  <g transform="translate(8, 4)">
    <!-- Subtle emblem backdrop with warm orange border -->
    <rect x="0" y="0" width="118" height="118" rx="16" fill="#FFF9F2" stroke="#FFD8B2" stroke-width="2"/>
    <!-- Faucet T-Handle at top in Brand Orange -->
    <rect x="30" y="10" width="58" height="10" rx="5" fill="#FF850D"/>
    <circle cx="30" cy="15" r="7.5" fill="#D96B00"/>
    <circle cx="88" cy="15" r="7.5" fill="#D96B00"/>
    <circle cx="59" cy="14" r="8.5" fill="#FF850D"/>
    <!-- Valve stem & bonnet -->
    <rect x="53" y="20" width="12" height="16" rx="2" fill="#D96B00"/>
    <rect x="44" y="33" width="30" height="10" rx="3" fill="#FF850D"/>
    <rect x="40" y="41" width="38" height="7" rx="2" fill="#D96B00"/>
    <!-- Bold Faucet body curving into downward spout on left and inlet flange on right -->
    <path d="M 42 48 L 76 48 L 76 58 L 104 58 L 104 86 L 74 86 C 64 86, 50 86, 41 80 C 30 80, 26 87, 26 98 L 8 98 C 8 72, 20 58, 42 56 Z" fill="#FF850D"/>
    <!-- Right pipe flange -->
    <rect x="98" y="51" width="14" height="42" rx="3.5" fill="#D96B00"/>
    <!-- Left spout nozzle rim -->
    <rect x="5" y="94" width="25" height="9" rx="3" fill="#D96B00"/>
    <!-- Monogram Letters M, F, E in Orange -->
    <text x="8" y="48" font-family="'Inter', 'Arial Black', system-ui, sans-serif" font-weight="900" font-size="26" fill="#FF850D">M</text>
    <text x="82" y="48" font-family="'Inter', 'Arial Black', system-ui, sans-serif" font-weight="900" font-size="26" fill="#FF850D">F</text>
    <text x="48" y="114" font-family="'Inter', 'Arial Black', system-ui, sans-serif" font-weight="900" font-size="27" fill="#FF850D">E</text>
  </g>

  <!-- Vertical Divider Bar + D accent -->
  <line x1="138" y1="12" x2="138" y2="68" stroke="#073253" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <text x="130" y="92" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="20" fill="#FF850D">D</text>

  <!-- Bold Wordmark MICHAFORGE in Deep Navy Blue -->
  <text x="152" y="58" font-family="'Inter', 'Arial Black', system-ui, sans-serif" font-weight="900" font-size="54" letter-spacing="2" fill="#073253">MICHAFORGE</text>

  <!-- — ENTERPRISES — in Brand Orange centered below MICHAFORGE -->
  <line x1="160" y1="78" x2="218" y2="78" stroke="#073253" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <text x="368" y="86" text-anchor="middle" font-family="'Inter', 'Arial Black', system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="5" fill="#FF850D">ENTERPRISES</text>
  <line x1="518" y1="78" x2="576" y2="78" stroke="#073253" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Full-width Navy Pill Badge: • DEALERS IN ALL PLUMBING MATERIALS • -->
  <rect x="132" y="95" width="458" height="27" rx="13.5" fill="#073253"/>
  <circle cx="148" cy="108.5" r="4" fill="#FF850D"/>
  <text x="361" y="113" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="13.5" letter-spacing="1.6" fill="#FFFFFF">DEALERS IN ALL PLUMBING MATERIALS</text>
  <circle cx="574" cy="108.5" r="4" fill="#FF850D"/>
</svg>
